# LibraLink Desk reverse proxy.
# Jobs: 1) pass traffic to LibreChat, 2) inject the LibraLink theme, 3) serve the
# LibraLink logo/icons in place of LibreChat's, 4) write a JSON access log for CloudWatch.
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # One JSON line per request. No IP address and no query string are logged (privacy),
    # only what we need for monitoring: path, status, size and timing.
    log_format json escape=json
      '{"ts":"$time_iso8601","method":"$request_method","path":"$uri",'
      '"status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,'
      '"upstream_time":"$upstream_response_time"}';
    access_log /var/log/nginx/access.log json;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    upstream librechat { server api:3080; keepalive 16; }

    server {
        listen 80 default_server;
        server_name _;
        client_max_body_size 25m;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Health probe for nginx itself (not logged, so it does not inflate request counts).
        location = /nginx-health { access_log off; return 200 "ok\n"; }

        # LibraLink logo and icons replace LibreChat's.
        location ~ ^/assets/(logo\.svg|favicon-16x16\.png|favicon-32x32\.png|apple-touch-icon-180x180\.png|icon-192x192\.png|maskable-icon\.png)$ {
            root /branding;
            try_files /$1 @app;
            expires 1h;
        }
        location = /manifest.webmanifest { root /branding; try_files /manifest.webmanifest @app; }
        location = /libralink.css { root /branding; expires 10m; }
        location = /libralink.js  { root /branding; expires 10m; }

        location / {
            proxy_pass http://librechat;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;   # CloudFront terminates HTTPS in front of us
            proxy_read_timeout 300s;                    # AI answers can take a while
            proxy_buffering off;                        # needed for streamed (word-by-word) answers

            # Ask LibreChat for uncompressed HTML so sub_filter can insert our theme.
            proxy_set_header Accept-Encoding "";
            sub_filter '</head>' '<link rel="stylesheet" href="/libralink.css"><script defer src="/libralink.js"></script></head>';
            sub_filter_once on;
        }

        location @app {
            proxy_pass http://librechat;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }
    }
}
